<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 历史报告 · 热点监控看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d28;--card2:#232635;--accent:#6c5ce7;--accent2:#a29bfe;--s-color:#ff4757;--a-color:#ff9f43;--b-color:#feca57;--text:#e8e8e8;--text2:#a0a0b0;--border:#2d3045;--green:#2ed573;--shadow:0 4px 20px rgba(0,0,0,0.3)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:16px}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:28px;background:linear-gradient(135deg,#6c5ce7,#a29bfe,#74b9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header .sub{color:var(--text2);font-size:14px;margin-bottom:16px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s;box-shadow:0 2px 12px rgba(255,107,107,0.3)}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,107,107,0.5)}

.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0;padding:16px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat-item{background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)}
.stat-item .num{font-size:28px;font-weight:700;color:var(--accent2)}
.stat-item .label{font-size:12px;color:var(--text2);margin-top:4px}

.loading{text-align:center;padding:60px;color:var(--text2);font-size:16px}
.loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

.date-group{margin:24px 0}
.date-header{font-size:18px;font-weight:700;color:var(--accent2);padding:12px 0;border-bottom:2px solid var(--border);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.date-header .count{font-size:12px;color:var(--text2);background:var(--card2);padding:2px 10px;border-radius:12px}

.report-card{background:var(--card);border-radius:12px;margin:10px 0;overflow:hidden;border:1px solid var(--border);transition:all .2s;display:flex;align-items:stretch;text-decoration:none;color:inherit}
.report-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.report-time{padding:16px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:90px;background:var(--card2);border-right:1px solid var(--border)}
.report-time .time{font-size:22px;font-weight:700;color:var(--accent2)}
.report-time .period{font-size:12px;color:var(--text2);margin-top:2px}
.report-info{flex:1;padding:14px 20px;display:flex;flex-direction:column;justify-content:center}
.report-info .title{font-size:15px;font-weight:600;margin-bottom:4px}
.report-info .meta{font-size:12px;color:var(--text2)}
.report-link{padding:16px 20px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent2);transition:color .2s}
.report-link:hover{color:var(--accent)}

.empty{text-align:center;padding:80px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:16px}
.empty .msg{font-size:16px;line-height:1.8}

footer{text-align:center;padding:30px 0;color:var(--text2);font-size:12px}
footer p{margin:4px 0}
footer a{color:var(--accent2);text-decoration:none}
footer a:hover{text-decoration:underline}

@media(max-width:600px){
  header h1{font-size:22px}
  .stats{grid-template-columns:1fr}
  .report-time{min-width:70px;padding:12px}
  .report-time .time{font-size:18px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📚 历史报告归档</h1>
<p class="sub">每次监控生成的报告均已归档，可随时查阅历史内容、预判及评论<br><span style="color:#ff9f43;font-size:13px">📌 历史报告保留最近30天，过期自动清理</span></p>
<a href="../" class="back-btn">🔥 返回最新看板</a>
</header>

<div class="filter-bar" id="filterBar">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="07">早报 7:00</button>
<button class="filter-btn" data-filter="09">早间 9:00</button>
<button class="filter-btn" data-filter="12">午报 12:00</button>
<button class="filter-btn" data-filter="15">下午 15:00</button>
<button class="filter-btn" data-filter="18">晚报 18:00</button>
<button class="filter-btn" data-filter="21">夜报 21:00</button>
</div>

<div class="stats">
<div class="stat-item"><div class="num" id="totalCount">-</div><div class="label">总报告数</div></div>
<div class="stat-item"><div class="num" id="dayCount">-</div><div class="label">覆盖天数</div></div>
<div class="stat-item"><div class="num" id="latestDate">-</div><div class="label">最新报告</div></div>
</div>

<div id="content">
<div class="loading">
<div class="spinner"></div>
<p>正在加载历史报告列表...</p>
</div>
</div>

<footer>
<p>📊 热点监控看板 · 历史报告归档</p>
<p><a href="../">← 返回最新看板</a></p>
</footer>
</div>

<script>
// 从静态 manifest.json 加载历史列表（不依赖 GitHub API，永不限流）
const MANIFEST_URL = 'manifest.json';

let allReports = [];

const periodMap = {
  '07': {name: '早报', emoji: '🌅'},
  '09': {name: '早间报', emoji: '☀️'},
  '10': {name: '下周预测', emoji: '🔮'},
  '12': {name: '午报', emoji: '☀️'},
  '15': {name: '下午报', emoji: '🌤'},
  '16': {name: '下午报', emoji: '🌤'},
  '18': {name: '晚报', emoji: '🌆'},
  '20': {name: '夜报', emoji: '🌙'},
  '21': {name: '夜报', emoji: '🌙'},
};

function parseFileName(name) {
  const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})\.html$/);
  if (!m) return null;
  const [, year, month, day, hour, min] = m;
  const period = periodMap[hour] || {name: '报告', emoji: '📄'};
  return {
    year, month, day, hour, min,
    date: `${year}-${month}-${day}`,
    dateLabel: `${month}月${day}日`,
    fullDateLabel: `${year}年${month}月${day}日`,
    time: `${hour}:${min}`,
    period,
    fileName: name,
    sortKey: `${year}${month}${day}${hour}${min}`,
  };
}

async function loadReports() {
  try {
    const resp = await fetch(MANIFEST_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    
    // manifest.json 格式: { "files": ["20260421_1800.html", ...] }
    const files = data.files || [];
    
    allReports = files
      .map(f => parseFileName(f))
      .filter(Boolean)
      .sort((a, b) => b.sortKey.localeCompare(a.sortKey));

    renderStats();
    renderReports(allReports);
  } catch (err) {
    console.error('Load failed:', err);
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="icon">📭</div>
        <div class="msg">暂无历史报告<br><br>
        <span style="font-size:13px;color:var(--text2)">
          历史报告会在每次定时监控任务执行后自动归档<br>
          每天最多6份（7:00 / 9:00 / 12:00 / 15:00 / 18:00 / 21:00）<br>
          报告保留最近30天，过期自动清理<br>
          请稍后再来查看 ~
        </span></div>
      </div>`;
  }
}

function renderStats() {
  const total = allReports.length;
  const days = new Set(allReports.map(r => r.date)).size;
  const latest = allReports.length > 0 ? allReports[0].dateLabel : '-';
  document.getElementById('totalCount').textContent = total || '-';
  document.getElementById('dayCount').textContent = days || '-';
  document.getElementById('latestDate').textContent = latest;
}

function renderReports(reports) {
  if (reports.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="icon">📭</div>
        <div class="msg">暂无匹配的历史报告</div>
      </div>`;
    return;
  }

  const groups = {};
  reports.forEach(r => {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });

  let html = '';
  for (const [date, items] of Object.entries(groups)) {
    const first = items[0];
    html += `<div class="date-group">
      <div class="date-header">📅 ${first.fullDateLabel} <span class="count">${items.length}份报告</span></div>`;
    
    for (const r of items) {
      html += `<a href="${r.fileName}" class="report-card">
        <div class="report-time">
          <div class="time">${r.time}</div>
          <div class="period">${r.period.name}</div>
        </div>
        <div class="report-info">
          <div class="title">${r.period.emoji} ${r.fullDateLabel} ${r.period.name} ${r.time}</div>
          <div class="meta">热点监控完整报告 · 含事件分析+评论运营</div>
        </div>
        <div class="report-link">→</div>
      </a>`;
    }
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

// 筛选
document.getElementById('filterBar').addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  const filter = e.target.dataset.filter;
  if (filter === 'all') {
    renderReports(allReports);
  } else {
    renderReports(allReports.filter(r => r.hour === filter));
  }
});

loadReports();
</script>
</body>
</html>
